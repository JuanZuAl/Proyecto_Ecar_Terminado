<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECAR - Sistema de Auditoría de Equipos</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="ECAR.Client.styles.css" rel="stylesheet" />
    <link href="styles/theme.css" rel="stylesheet" />
    <link href="css/print-resultado.css" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="shortcut icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <!-- Mientras se descargan los archivos de Blazor (unos 10 MB la primera vez) se ve la palabra
         «Cargando…» en vez de una pantalla vacía (M-12). Solo texto y con el estilo en línea: sin imagen
         ni css/app.css, que no se carga y dejaba un círculo negro al recargar tras iniciar sesión.
         Blazor reemplaza el contenido de #app al arrancar. -->
    <div id="app">
        <div id="cargando" role="status"
             style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Roboto, Arial, sans-serif; font-size: 1.125rem; color: #5A6A7C;">
            Cargando…
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/firma.js"></script>
    <script src="js/descargas.js"></script>
    <script src="js/etiqueta-qr.js"></script>
    <script src="js/actividad.js"></script>
    <script src="lib/html5-qrcode/html5-qrcode.min.js"></script>
    <script src="js/escaner-qr.js"></script>
    <script src="js/formularios.js"></script>
    <script src="js/visor-imagen.js"></script>
</body>

</html>
